{% extends "base.html" %}{% block content %}<section class="auth"><div class="authintro"><small class="eyebrow">HELP YOUR CAMPUS</small><h1>Report a {{ kind }} item</h1><p>Give clear details. Keep one unique ownership clue private so the real owner can verify the item.</p></div><form class="form" method="post" enctype="multipart/form-data"><label>Item name<input name="name" required maxlength="100" placeholder="Blue water bottle"></label><label>Category<select name="category" required><option value="">Choose</option>{% for c in ['ID Card','Electronics','Books & Stationery','Bags','Clothing','Keys','Wallet','Water Bottle','Accessories','Other'] %}<option>{{ c }}</option>{% endfor %}</select></label><label>Description<textarea name="description" required rows="4"></textarea></label><label>Campus location<input name="location" required placeholder="Central Library"></label><label>Date<input type="date" name="item_date" required></label><label>Photo (optional)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"><small>PNG/JPG/WEBP, maximum 5 MB</small></label><button class="btn full">Submit {{ kind }} report</button></form></section>{% endblock %}
