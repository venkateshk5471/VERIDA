<article class="item"><a href="{{ url_for('detail',item_id=item.id) }}">{% if item.image %}<img src="{{ url_for('static',filename='uploads/'+item.image) }}" alt="{{ item.name }}">{% else %}<div class="placeholder">◇</div>{% endif %}</a><div class="pad"><span class="pill {{ item.kind }}">{{ item.kind|upper }}</span><small>{{ item.category }}</small><h3><a href="{{ url_for('detail',item_id=item.id) }}">{{ item.name }}</a></h3><p>{{ item.description[:90] }}{% if item.description|length>90 %}…{% endif %}</p><small>⌖ {{ item.location }} · {{ item.item_date }}</small></div></article>
