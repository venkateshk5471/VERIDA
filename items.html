{% extends "base.html" %}{% block content %}<section class="heading"><small class="eyebrow">CAMPUS ITEM DIRECTORY</small><h1>Browse reports</h1><p>Search reported lost and found belongings.</p></section><form class="search"><input name="q" value="{{ q }}" placeholder="Search item, description or location"><select name="kind"><option value="">All reports</option><option value="lost" {% if kind=='lost' %}selected{% endif %}>Lost</option><option value="found" {% if kind=='found' %}selected{% endif %}>Found</option></select><button class="btn">Search</button></form><div class="grid">{% for item in items %}{% include "_card.html" %}{% else %}<p>No matching reports. Try another search.</p>{% endfor %}</div>{% endblock %}
